<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>게시글 등록</title>
</head>
<body>
<h2>게시글 등록</h2>
<hr/>

<form th:action="@{/Post/insert}" method="post">
    <table border="1" cellpadding="8" cellspacing="0" style="width: 600px; border-collapse: collapse;">
        <tr>
            <th bgcolor="#f2f2f2" width="25%">제목</th>
            <td><input type="text" name="title" required style="width: 95%;"/></td>
        </tr>
        <tr>
            <th bgcolor="#f2f2f2">작성자</th>
            <td><input type="text" name="writer" required style="width: 95%;"/></td>
        </tr>
        <tr>
            <th bgcolor="#f2f2f2">내용</th>
            <td>
                <textarea name="content" rows="10" required style="width: 95%; resize: vertical;"></textarea>
            </td>
        </tr>
    </table>
    <br/>
    <div>
        <button type="submit">등록</button>
        <a th:href="@{/Post/list}"><button type="button">취소</button></a>
    </div>
</form>
</body>
</html>
